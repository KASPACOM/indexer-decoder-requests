request:
  app_name: "wETH — trust-minimised ETH↔Kaspa ZK bridge"
  slug: "weth-eth-kaspa-bridge"
  requester:
    name: "gordonmurray-coding"
    github: "gordonmurray-coding"
    contact: "https://github.com/gordonmurray-coding/eth-kaspa-bridge"
  status: proposed
  target_networks:
    - mainnet
    - tn10
  request_type:
    kind: new_decoder
    priority: normal

protocol:
  family: "KCC20 (silverscript covenant)"
  version: "kcc20.sil compiled at maxCovIns = maxCovOuts = 2"
  description: >
    wETH is ETH wrapped onto Kaspa by a trust-minimised ZK bridge. ETH is locked in an Ethereum
    escrow; an SP1/Groth16 proof of that deposit is verified on-chain by a Kaspa covenant, which
    then mints a KCC20 note. Supply is 1:1 with locked ETH by construction — the minter only emits
    when a deposit proof co-spends, and burning requires the registry to absorb the note.
    The held note is the PRISTINE canonical kcc20.sil skeleton (no custom token script), so
    registering that one template makes this and every other canonical KCC20 token decodable.
    The first mainnet mint settled 2026-08-09 and the note is live and unspent.
  public_spec_url: "https://github.com/gordonmurray-coding/eth-kaspa-bridge/blob/main/KCC20-COMPAT.md"
  source_repo_url: "https://github.com/gordonmurray-coding/eth-kaspa-bridge"
  license: "MIT"

explorer_goal:
  summary: >
    Classify the canonical KCC20 held-note skeleton so wETH notes show as a token balance with an
    owner and amount, instead of classificationKind=unknown / classificationStatus=unmatched.
  user_story: >
    A user bridges ETH to Kaspa and opens KasWare. Today the wETH note is invisible: it lives at a
    P2SH covenant address with ownership encoded inside the script, and no wallet derives that. The
    user has to be told "your funds are fine, check the relayer's /notes endpoint", which is not an
    acceptable answer for a bridge. With the canonical KCC20 template registered, the note appears
    as a balance under the address that owns it.
  needed_views:
    - covenant_detail
    - transaction_detail
    - address_activity
  needed_api_routes:
    - /covenants/by-id/{covenant_id}
    - /tx/{txid}/settlement-status
    - /covenants?template=KCC20&verified_only=true
    - /addresses/{covenant_address}/covenants
  display_fields:
    - name: "owner"
      description: "ownerIdentifier from the KCC20 state header (32 bytes) plus identifierType"
      example: "kaspa:qrv56qnz2eya80zzs9v0k2jzuw6nwqlrlgv7vlrfjmnflauukc0hzffhan3rm (idType 0x00 PUBKEY)"
    - name: "amount"
      description: "token amount from the KCC20 state header, 8-byte LE; wETH uses 18 decimals"
      example: "20000000000000000 (0.02 wETH)"
    - name: "token"
      description: "canonical token id / covenant id of the token covenant"
      example: "88437964648fed0b1e1f78b2c912ddfa11029322d5f673318765fd7f1565284a"
  success_criteria:
    - "GET /covenants/by-id/88437964648fed0b1e1f78b2c912ddfa11029322d5f673318765fd7f1565284a returns 200 with classificationKind=KCC20 (currently 404 'no covenant')"
    - "GET /tx/cc345e1a522cdf3eba9864de437f3366068bf7d6f55f14b2ad6e6593b37ba306/settlement-status reports the note output as a matched KCC20 action rather than classificationStatus=unmatched"
    - "GET /covenants?template=KCC20&verified_only=true returns a non-empty list (currently [])"
    - "The note at cc345e1a…:1 reports owner kaspa:qrv56qnz… and amount 20000000000000000"

