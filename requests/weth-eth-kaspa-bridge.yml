    observed_status: >
      Measured 2026-08-09 against indexer.kaspa.com (mainnet).
      /covenants/by-id/{covid} returns 404 "no covenant <covid>" for the token, minter and registry.
      /covenants?template=KCC20 and /kcc20/markets both return [].
      IMPORTANTLY the indexer already ingests these transactions correctly:
      /tx/cc345e1a…/settlement-status returns 200 with actionCount 7 and correctly typed actions
      (3x spend, 2x continuation, 2x deploy) — every one carrying classificationKind=unknown with
      classificationStatus=unmatched (spend/continuation) or unrevealed (deploy), and template=null.
      So this is purely a missing template registration, not an ingestion gap.
      The superseded deployment covid 383080a7… behaves identically, which rules out anything
      specific to the current deployment.

decode_contract:
  p2sh_reveal_shape: >
    P2SH(prefix || encoded_state || suffix) where encoded_state begins with the canonical KCC20
    header { ownerIdentifier: byte[32], identifierType: byte, amount: int }. identifierType is
    0x00 PUBKEY for every note this bridge currently creates. Recognition is a structural
    opcode-skeleton match of the revealed redeem: opcodes and push LENGTHS align, push VALUES are
    the state slots.
  template_or_protocol_marker: >
    Pristine canonical kcc20.sil compiled at maxCovIns = maxCovOuts = 2 — the "variant a"
    skeleton, 1568-byte redeem. This is NOT a bridge-specific script: it is the unmodified
    canonical KCC20 example. The (4,4) compilation is a different skeleton and must not be
    conflated with it. We verified exact opcode-skeleton equality against the reference fixture.
  compiled_artifact_url: "https://github.com/gordonmurray-coding/eth-kaspa-bridge/blob/main/covenant/kcc20.sil"
  payload_schema:
    description: >
      NOT YET IMPLEMENTED, and we would like guidance. Per docs/covenant-indexer-best-practices.md
      a deploy tx should carry a public tx.payload claim. Our genesis transactions currently write
      an EMPTY payload (verified: the mint tx cc345e1a… has payload length 0), because these
      covenants were deployed before we read this guidance. We are willing to emit the
      {v, tmpl, args, meta} envelope on the next cascade if it materially helps classification.
      Note it should not be REQUIRED here: the held-note skeleton is fully revealed on chain, so
      the decoder has everything it needs from the reveal itself. Payload claims are described in
      the guidance as early hints rather than product truth.
    required_fields:
      - "(none currently emitted — see description)"
  actions:
    - name: "kcc20_mint"
      trigger: >
        The minter covenant is spent together with a proof of an Ethereum deposit; net emission
        equals the proven deposit amount. Output 1 is a new canonical KCC20 held note.
      expected_indexer_action: "deploy/continuation classified as KCC20 with a matched template"
      expected_template_name: "KCC20"
      expected_decoded_args:
        owner: "d94d02625649d3bc428158fb2a42e3b53703e3fa19e67c6996e69ff79cb61f71"
        identifierType: "0x00"
        amount: "20000000000000000"
      expected_api_response:
        route: "/covenants/by-id/88437964648fed0b1e1f78b2c912ddfa11029322d5f673318765fd7f1565284a"
        fields:
          - name: "classificationKind"
            example: "KCC20"
          - name: "classificationStatus"
            example: "matched"
    - name: "kcc20_transfer"
      trigger: >
        Canonical KCC20 transfer. Sig-script args [newStates, sigs, witnesses] with prevStates
        injected by the framework; witnesses=[0] for a PUBKEY owner. Conserves amount
        (totalIn == totalOut) — the held note is isMinter=false and cannot inflate supply.
      expected_indexer_action: "spend + continuation classified as KCC20 transfer"
      expected_template_name: "KCC20"
      expected_decoded_args:
        newOwner: "32-byte ownerIdentifier from the new state"
        amount: "unchanged from the previous state"
      expected_api_response:
        route: "/tx/{txid}/settlement-status"
        fields:
          - name: "classificationStatus"
            example: "matched"
  state_transitions:
    - from: "minter covenant + Ethereum deposit proof"
      to: "new KCC20 held note (isMinter=false) + minter continuation"
      trigger: "kcc20_mint — net emission equals the proven ETH deposit"
    - from: "KCC20 held note (owner A)"
      to: "KCC20 held note (owner B), amount conserved"
      trigger: "kcc20_transfer"
    - from: "KCC20 held note + registry"
      to: "note absorbed, supply reduced"
      trigger: "burn — unlocks the corresponding ETH on Ethereum"
  balances_or_positions:
    description: >
      Balance is read directly from the KCC20 state header of each held note; a wallet's balance is
      the sum of notes whose ownerIdentifier matches. wETH uses 18 decimals to mirror ETH, so the
      header amount is in wei.
    owner_identifier: "ownerIdentifier (byte[32]) + identifierType (byte, 0x00 PUBKEY)"
    amount_field: "amount (int, 8-byte LE in the encoded state)"

