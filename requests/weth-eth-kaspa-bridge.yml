compatibility:
  related_standards:
    - "KCC20 fungible token covenant (canonical kcc20.sil / kcc20-minter.sil)"
    - "KRC-20 (inscription-based) — unrelated encoding, listed to avoid conflation"
  conflicts_or_overlap:
    - >
      No overlap with the 13 inscription-based templates (KRC-20 / KRC-721 / KNS) currently in the
      registry: this is a script-covenant reveal, not an OP_FALSE OP_IF inscription envelope.
    - >
      The (2,2) and (4,4) compilations of kcc20.sil are DIFFERENT skeletons. Registering one does
      not classify the other. We use (2,2) for held notes.
    - >
      wETH deviates from vanilla KCC20 in supply RULES only, not in the held-note shape: mint
      requires a bridge mint-authority co-spend with net emission equal to the proven ETH deposit,
      and burn requires registry absorption. Balance reads are unaffected — a decoder reads the
      header exactly as for any canonical KCC20 note.
  backwards_compatibility_notes: >
    Registering the canonical (2,2) skeleton benefits every canonical KCC20 token, not just wETH.
    kascov.io already recognises this exact skeleton on both mainnet and tn10 (status verified,
    template "KCC20 token"), so there is an independent implementation to cross-check against.

maintainer_notes:
  open_questions:
    - >
      Do you want the tx.payload {v, tmpl, args, meta} claim on deploy for this to be actionable?
      Our current covenants emit an empty payload. We can add it on the next deployment cascade,
      but we would rather not cascade purely for a hint field if the reveal is sufficient.
    - >
      Should the canonical KCC20 template be registered generically (any kcc20.sil (2,2) covenant),
      or per-token with wETH registered as a specific instance? We would prefer generic, since it
      fixes the whole class.
    - >
      Is there a public way to see which templates are registered? We inferred the current set
      from behaviour rather than from an endpoint, and would rather verify than infer.
  requested_timeline: "No deadline. wETH is live on mainnet and usable via the bridge's own /notes endpoint; wallet display is the gap."
  implementation_owner: ""
  implementation_pr: ""
  deployment_status_url: ""
  verified_live_links: []
