# Example only. Do not edit this file for a real request.

request:
  app_name: "Example Marketplace"
  slug: "example-marketplace-orders"
  requester:
    name: "Example Team"
    github: "example-org"
    contact: "https://github.com/example-org/example-marketplace"
  status: proposed
  target_networks:
    - tn10
  request_type:
    kind: new_decoder
    priority: normal

protocol:
  family: "ExampleOrderbook"
  version: "1"
  description: "Fixed-price ask and fill flow for example game items."
  public_spec_url: "https://github.com/example-org/example-marketplace/blob/main/SPEC.md"
  source_repo_url: "https://github.com/example-org/example-marketplace"
  license: "MIT"

explorer_goal:
  summary: "Show marketplace asks and fills as decoded order actions."
  user_story: "A user opens a tx in the explorer and sees createAsk or fillAsk instead of unknown."
  needed_views:
    - transaction_detail
    - covenant_detail
    - address_activity
  needed_api_routes:
    - /tx/{txid}
    - /covenants/by-id/{covenant_id}
    - /addresses/{covenant_address}/covenants
  display_fields:
    - name: itemId
      description: "Application item identifier."
      example: "sword-0001"
    - name: priceSompi
      description: "Fixed ask price in sompi."
      example: "100000000"
  success_criteria:
    - "The create tx returns action=createAsk from /tx/{txid}."
    - "The fill tx returns action=fillAsk and links to the original order outpoint."
    - "The explorer transaction page shows itemId, seller, buyer, and priceSompi."

chain_evidence:
  txids:
    - network: tn10
      txid: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      expected_action: createAsk
      explorer_url: "https://tn10-covenants.kaspa.com/tx/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    - network: tn10
      txid: "fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
      expected_action: fillAsk
      explorer_url: "https://tn10-covenants.kaspa.com/tx/fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210"
  addresses:
    - network: tn10
      address: "kaspatest:exampleaddress"
      role: seller
  outpoints:
    - txid: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      vout: 1
      role: ask_utxo
  covenant_ids:
    - "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  current_behavior:
    api_url: "https://tn10-indexer.kaspa.com/tx/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    explorer_url: "https://tn10-covenants.kaspa.com/tx/0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    observed_status: "unknown"

decode_contract:
  p2sh_reveal_shape: "P2SH spend reveal contains compiled ExampleOrderbook artifact."
  template_or_protocol_marker: "ExampleOrderbookV1"
  compiled_artifact_url: "https://github.com/example-org/example-marketplace/blob/main/artifacts/ExampleOrderbook.json"
  payload_schema:
    description: "Order args encoded in constructor args."
    required_fields:
      - itemId
      - seller
      - priceSompi
  actions:
    - name: createAsk
      trigger: "deploy or continuation creates an active ask UTXO"
      expected_indexer_action: createAsk
      expected_template_name: ExampleOrderbookV1
      expected_decoded_args:
        itemId: "sword-0001"
        seller: "seller-pubkey-or-address"
        priceSompi: "100000000"
      expected_api_response:
        route: /tx/{txid}
        fields:
          - name: action
            example: createAsk
          - name: itemId
            example: "sword-0001"
    - name: fillAsk
      trigger: "buyer spends the active ask UTXO and pays seller"
      expected_indexer_action: fillAsk
      expected_template_name: ExampleOrderbookV1
      expected_decoded_args:
        itemId: "sword-0001"
        buyer: "buyer-pubkey-or-address"
        priceSompi: "100000000"
      expected_api_response:
        route: /tx/{txid}
        fields:
          - name: action
            example: fillAsk
          - name: status
            example: filled
  state_transitions:
    - from: none
      to: open
      trigger: createAsk
    - from: open
      to: filled
      trigger: fillAsk
  balances_or_positions:
    description: "No fungible balance; item ownership moves from seller to buyer."
    owner_identifier: "buyer"
    amount_field: ""

fixtures:
  included_in_pr: []
  external_links:
    - "https://github.com/example-org/example-marketplace/tree/main/fixtures"
  reproduction_steps:
    - "Clone the source repo."
    - "Run npm test -- example-orderbook-fixture."
    - "Submit the generated createAsk and fillAsk txs on TN10."
  expected_test_cases:
    - name: create ask fixture decodes
      given: "createAsk tx fixture"
      expect: "action=createAsk, itemId=sword-0001, status=open"
    - name: fill ask fixture decodes
      given: "fillAsk tx fixture"
      expect: "action=fillAsk, itemId=sword-0001, status=filled"

compatibility:
  related_standards:
    - KCC20
  conflicts_or_overlap:
    - "Uses marketplace naming but does not create KCC20 token balances."
  backwards_compatibility_notes: "No existing decoder should classify this marker."

maintainer_notes:
  open_questions:
    - "Should item ownership get a dedicated API route or only transaction detail?"
  requested_timeline: "No deadline."
  implementation_owner: ""
  implementation_pr: ""
  deployment_status_url: ""
  verified_live_links:
    - ""
